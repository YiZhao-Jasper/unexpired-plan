[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unexpired-plan"
version = "0.1.0"
description = "Reference-plan monitoring for accelerated action-chunking policies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "YiZhao-Jasper"}]
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://yizhao-jasper.github.io/unexpired-plan/"
Repository = "https://github.com/YiZhao-Jasper/unexpired-plan"
Issues = "https://github.com/YiZhao-Jasper/unexpired-plan/issues"

[project.scripts]
unexpired-plan = "unexpired_plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
