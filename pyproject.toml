[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unexpired-plan"
version = "0.2.0"
description = "Reference-plan monitoring for accelerated action-chunking policies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "YiZhao-Jasper"}]
dependencies = ["numpy>=1.24,<3"]
keywords = ["robotics", "diffusion-policy", "action-chunking", "policy-monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.urls]
Paper = "https://arxiv.org/abs/2610.05747"
Homepage = "https://yizhaojasper.com/unexpired-plan/"
Repository = "https://github.com/YiZhao-Jasper/unexpired-plan"
Issues = "https://github.com/YiZhao-Jasper/unexpired-plan/issues"
Documentation = "https://github.com/YiZhao-Jasper/unexpired-plan/blob/main/examples/README.md"

[project.scripts]
unexpired-plan = "unexpired_plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["unexpired_plan*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]
